name: Generate Pull Request Dependency Snapshot

on:
  pull_request:
    branches:
      - master

concurrency:
  group: dependency-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Generate dependency snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Generate and upload dependency snapshot
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        env:
          GITHUB_DEPENDENCY_GRAPH_REF: refs/pull/${{ github.event.pull_request.number }}/head
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          dependency-graph: generate-and-upload
          additional-arguments: --no-configuration-cache
          artifact-retention-days: 1
          cache-read-only: true
