name: Submit Pull Request Dependency Snapshot

on:
  workflow_run:
    workflows:
      - Generate Pull Request Dependency Snapshot
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  submit:
    name: Submit dependency snapshot
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and submit dependency snapshot
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: download-and-submit
