name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test
        run: ./gradlew check

      - name: Validate project and archive structure
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure

      - name: Build and verify plugin
        run: ./gradlew buildPlugin verifyPlugin

      - name: Upload plugin ZIP
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contextual-bookmarks-plugin
          path: build/distributions/*.zip
          if-no-files-found: warn

      - name: Upload verification and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contextual-bookmarks-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: warn
