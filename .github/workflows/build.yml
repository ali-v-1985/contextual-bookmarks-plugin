name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Test
        run: ./gradlew check

      - name: Validate project and archive structure
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure

      - name: Build and verify plugin
        run: ./gradlew buildPlugin verifyPlugin

      - name: Upload plugin ZIP
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contextual-bookmarks-plugin
          path: build/distributions/*.zip
          if-no-files-found: warn

      - name: Upload verification and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contextual-bookmarks-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: warn
