name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "41 4 * * 2"

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false
      - name: Lint workflows and archive check scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          bash -n scripts/verify-plugin-archive.sh scripts/test-verify-plugin-archive.sh
          scripts/test-verify-plugin-archive.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Format, test, and enforce coverage
        run: ./gradlew check

      - name: Validate project and archive structure
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure

      - name: Build and verify plugin compatibility
        run: ./gradlew buildPlugin verifyPlugin

      - name: Validate plugin ZIP contents
        run: scripts/verify-plugin-archive.sh

      - name: Upload verified plugin ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contextual-bookmarks-plugin-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification, test, and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contextual-bookmarks-reports-${{ github.sha }}
          path: |
            build/reports/kover/
            build/reports/tests/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14
