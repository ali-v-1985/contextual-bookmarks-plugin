version: "1.0"

linter: jetbrains/qodana-jvm-community:2026.2

profile:
  name: qodana.recommended

projectJDK: "21"

# Formatting and coverage are enforced by Gradle. Qodana blocks serious static-analysis
# regressions; lower severities remain visible in annotations and the uploaded report.
failureConditions:
  severityThresholds:
    critical: 0
    # The first full scan found seven existing style findings classified as high.
    # Keep the gate green at that baseline and ratchet it down as they are fixed.
    high: 7
